[package]
name = "bris-cli"
description = "Reference Bris frontend for desktop and embedded Linux deployments."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "bris"
path = "src/main.rs"

[dependencies]
bris-core.workspace = true
bris-almanac.workspace = true
bris-vision = { workspace = true, features = ["segmentation", "ml-gravity"] }
bris-platesolve.workspace = true
bris-nav.workspace = true
bris-nmea.workspace = true
bris-streaming = { workspace = true, features = ["segmentation", "ml-gravity"] }
bris-bundle.workspace = true
uuid.workspace = true
bris-capture.workspace = true
bris-calibrate.workspace = true
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc.workspace = true
indicatif.workspace = true
# Signed-update verification (`bris update`): Ed25519 over a
# BLAKE3 payload digest. blake3 is already used by bris-bundle
# / bris-ffi; ed25519-dalek + hex are MIT/BSD/Apache (cargo-deny
# clean).
ed25519-dalek = "2"
blake3 = "1"
hex = "0.4"

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
