[package]
name = "bris-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP service that accepts operator-initiated diagnostic submissions from Bris devices and stores them on the local filesystem. Spike-grade; see docs/design/diagnostic_collection.md."
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }

ulid = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"
sha2 = "0.10"
hex = "0.4"
# The real submitter code path (build_submission + operator gate +
# multipart encoder) and the bris-bundle v1 schema, so the
# end-to-end collection-path test exercises the ACTUAL submitter →
# collector seam rather than a hand-rolled multipart body. This is
# a dev-dependency cycle (bris-submit dev-depends on bris-collector
# for its own acceptance test); cargo permits dev-dependency
# cycles.
bris-submit = { workspace = true }
bris-bundle = { workspace = true }
image = { workspace = true }
# Builds and locates the real `bris` binary so the test can run
# `bris replay` against the stored submission, proving the bundle
# is replayable IN PLACE off the collector's data-root.
escargot = "0.5"

[[test]]
name = "e2e_collection_path"
path = "tests/e2e_collection_path.rs"

[lints]
workspace = true
