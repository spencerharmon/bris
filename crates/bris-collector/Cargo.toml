[package]
name = "bris-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP service that accepts operator-initiated diagnostic submissions from Bris devices and stores them on the local filesystem. Spike-grade; see docs/design/diagnostic_collection.md."
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }

ulid = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
# End-to-end acceptance test (collection-path-e2e): builds a
# real bris-bundle v1 submission via the submitter code path and
# POSTs it over a real loopback HTTP connection.
bris-submit = { workspace = true, features = ["http"] }
tokio = { version = "1", features = ["net"] }

[lints]
workspace = true
