[package]
name = "bris-streaming"
description = "Continuous-operation streaming engine: orchestrates classification, body and horizon detection, plate solving, sight assembly, and fix publication from a stream of camera frames."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Segmentation parallels bris-vision's flag. Off by default at
# the crate level so the FFI build for Android (which can't
# link ort) gets a clean subset; turned on by the CLI / capture
# / desktop consumers via `features = ["segmentation"]`.
default = []
segmentation = ["bris-vision/segmentation"]
# Mirrors bris-vision's ml-gravity feature; off by default for
# the same Android-target reason. See docs/design/ml_gravity.md.
ml-gravity = ["bris-vision/ml-gravity"]

[dependencies]
bris-core.workspace = true
bris-almanac.workspace = true
bris-vision.workspace = true
bris-platesolve.workspace = true
bris-nav.workspace = true
bris-nmea.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
tempfile.workspace = true
