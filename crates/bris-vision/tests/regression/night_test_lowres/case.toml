# Regression metadata for night_test_lowres.
#
# Cellphone night shot, bright moon visible, faint horizon, very
# dark. The user flagged this specifically: "I can make out the
# horizon and the stars, so it's a perfect test case for us." This
# is the highest-priority night case the user has captured.
#
# Frames are 9:16 portrait (1080×1920). The portrait orientation is
# the *intended* viewing orientation — phones encode in viewing
# order — so no rotation is applied.
#
# Frame is JPEG q85 (81 KB) — re-encoded from a 235 KB PNG to fit
# the corpus size constraint. Verified that compression doesn't
# change pipeline outputs (centroid shifted ~0.05 px).
#
# # Why every horizon detector currently fails on this frame
#
# The visible structure of the scene, top-to-bottom in image
# coordinates:
#
#   y=0..600   moon halo (luma peaks at y~350; moon disk
#              saturated; halo extends to ~y=600)
#   y=600..1300  dim featureless sky (per-row mean luma ~1000-1500;
#                per-row std-dev ~400-500; very uniform)
#   y=1300..1500 SEA HORIZON: transition from dim uniform sky to
#                textured moonlit sea
#   y=1500..1920 moonlit sea, brightest near horizon, dimming
#                toward bottom (per-row std-dev ~700-2200,
#                consistently 2-4× the sky std-dev)
#
# The existing night detector looks for the row of maximum mean-
# luma gradient. It finds the moon halo's edge (around y=257)
# instead of the actual horizon (around y=1310-1330) because the
# halo gradient is ~10× steeper than the sky-to-sea gradient.
# Body-exclusion via column mask doesn't help because the moon's
# halo extends radially well beyond the moon's column range.
# Multi-pass with row-exclusion doesn't help because the halo
# generates strong transitions at multiple y values (the inner
# halo edge AND the outer halo edge) before the sky-to-sea
# transition gets its turn.
#
# # The promising signal: per-row std-dev with the moon masked
#
# When a 2D box around the moon (e.g. ±250 px around moon
# centroid) is excluded, the per-row std-dev profile shows a
# sharp transition exactly at the horizon:
#
#   y=863..1247 (sky):  std-dev 363-474, ratio std/mean ~0.30-0.35
#   y=1343..1535 (sea): std-dev 1056-2222, ratio std/mean ~0.95-1.05
#
# The std-dev jumps by roughly 4× at the horizon row. This is
# because the dim sky is uniform (low texture variance) while the
# moonlit sea is textured (high variance from individual moon-
# glint reflections on water).
#
# Equivalently: contrast-stretch the lower half of the frame
# (rescaling the 5th to 95th percentile of the lower-half pixel
# values to span 0..u16::MAX) and look at the per-row mean.
# Stretched mean jumps from ~13600 at y=1296 to ~21300 at y=1320 —
# a 60% increase in 24 pixels, by far the sharpest transition in
# the lower half.
#
# # Detector implemented: detect_horizon_night_textured
#
# bris-vision::night_horizon::detect_horizon_night_textured uses
# the per-row std-dev signal directly. On this scene it lands at
# y ≈ 1329 — within ~20 px of the visible horizon. It works *even
# without the moon mask*, because the moon's bright halo doesn't
# generate texture (only mean-luma signal), so the std-dev
# detector is naturally blind to it.
#
# Validated by the
# night_test_lowres_textured_detector_finds_horizon static
# regression test in regression_test.rs. The body-excluding
# variant (detect_horizon_night_textured_excluding_body) gives
# the same result on this scene; it's exercised in the same test
# defensively against future regressions in the masking
# machinery.
#
# # Empirical
#   - Classifier correctly says Night (mean luma 0.024). Confidence
#     is moderate (0.52) because mean luma sits firmly in the night
#     band but lacks the astronomical prior that would push
#     confidence higher.
#   - Centroid finds the moon at (454, 350) on an 812-pixel bright
#     component. **This is the user's stated success criterion:
#     "moon centroiding *should* work."** It does.
#   - The textured-water detector finds the horizon at y ≈ 1329.
#     **This is the second success criterion**: with the right
#     detector, the horizon is now extractable.
#   - The three default horizon detectors (gradient, sky-region,
#     segmentation) still fail. The original night detector
#     (mean-gradient based) finds the moon halo's edge instead of
#     the horizon. None of these are wrong assertions — the
#     textured detector is the right tool for this scene, and the
#     case.toml below documents both the failures (for regression
#     detection) and the working path (in the docstring above and
#     the dedicated regression test).
#
# # Future work
#
# The streaming engine should pick the right detector per scene.
# Likely heuristic: when the classifier says Night and a
# saturated body is present, run both the mean-gradient and
# textured detectors; pick the one with the higher inlier
# fraction (or run both and keep both candidates for downstream
# disambiguation). Tracked in plan.org as Phase 3.5 work.

[case]
name         = "night_test_lowres"
description  = "Cellphone night shot; bright moon; horizon at y≈1329 found by detect_horizon_night_textured (per-row std-dev). Default mean-gradient detectors find moon halo's edge instead."
kind         = "working"
frame_count  = 1
frame_width  = 1080
frame_height = 1920
source_rotation_deg = 0
frames       = ["frame.jpg"]

[expected_classifier]
condition = "night"
# No min_confidence: the image-only classifier reports 0.52 here
# (mean luma well in the night band, but image-only confidence is
# capped without astronomical agreement). Asserting a floor would
# either trip on borderline night scenes or be uninformative; we
# rely on the condition match itself.

# Load-bearing: the moon is found by the unmasked centroid. The
# user's stated success criterion for this scene.
[expected_centroid_frame0]
x_px         = 454.54
y_px         = 349.92
tolerance_px = 5.0

# All three default horizon detectors fail. See the docstring at
# the top of this file for the per-row std-dev signal that *will*
# locate the horizon (around y=1310-1330) once the proposed
# moon-mask + std-dev algorithm lands.

[horizon.gradient]
outcome       = "err"
error_variant = "only 29 inliers"
correctness   = "wrong"
notes         = "Gradient threshold tuned for daylight luma. At night, only the moon halo produces above-threshold gradients."

[horizon.sky_region]
outcome       = "err"
error_variant = "only 40 inliers"
correctness   = "wrong"
notes         = "Sky-region detector requires a brightness percentile to identify 'sky'. In a uniformly-dark frame this percentile catches the moon halo (the only bright region) and finds its lower boundary, not the sea horizon."

[horizon.segmentation]
outcome       = "err"
error_variant = "only 90 inliers"
correctness   = "wrong"
notes         = "ADE20K-trained model finds some sky/sea structure but RANSAC rejects most as outliers. The textured detector (below) is the working path; the segmentation detector would still be useful as a per-frame quality vote in the future streaming engine."

# Single-pass night detector: returns the moon halo's edge at
# y≈258 — wrong horizon, but recorded so we notice if the value
# drifts. Listed as ok-but-wrong: the detector returns Ok with a
# value, but the value is the moon halo edge, not the actual
# horizon at y≈1310-1330.
[horizon.night]
outcome             = "ok"
slope               = 0.0001
intercept           = 257.82
slope_tolerance     = 0.05
intercept_tolerance = 15.0
inlier_count_min    = 60
correctness         = "wrong"
notes               = "Lands on the moon halo's edge, not the sea horizon. Default mean-gradient algorithm is fundamentally wrong for this scene; see [horizon.night_textured] for the working approach."

# Textured-water night detector: finds the actual horizon at
# y≈1329 via per-row std-dev signal. Works *without* the body-
# excluding mask because the moon's halo contributes mean-luma
# but not texture. **This is the working path on this scene.**
[horizon.night_textured]
outcome             = "ok"
slope               = -0.197
intercept           = 1329.5
slope_tolerance     = 0.10
intercept_tolerance = 30.0
inlier_count_min    = 70
correctness         = "approximately_correct"
notes               = "Lands on the actual sea-sky horizon at ~69% of frame height. The non-zero slope reflects real camera tilt at capture (handheld phone, no gimbal); slope tolerance is relaxed to accommodate this."

# Multi-pass mean-gradient night detector: still doesn't handle
# this scene. The moon's halo generates strong transitions at
# multiple y values (inner halo edge AND outer halo edge) before
# the dim sea-sky transition gets its turn; even with row
# exclusion, multi-pass enumerates halo features.
[horizon.night_multi_pass]
candidates_min          = 1
top_intercept           = 469.4
top_intercept_tolerance = 100.0
top_inlier_count_min    = 70
correctness             = "wrong"
notes                   = "Top candidate is in the upper portion of the frame (within the moon halo's influence). Multi-pass mean-gradient cannot find the actual horizon on this scene; the textured detector above is the working path."
