# Regression metadata for sailing_sun_upper_left.
#
# All values are recorded from the *current* output of the pipeline
# at the time this case was added or last updated. The regression
# tests assert the pipeline still produces values within tolerance.
#
# When intentionally improving an algorithm, update these recorded
# values and the test tolerances together; the commit message must
# explain why the change is an improvement (e.g. "previously detected
# the deck edge as horizon; now correctly detects the sea-sky
# boundary").
#
# Schema documented in tests/regression_test.rs (mod harness).

[case]
name                = "sailing_sun_upper_left"
description         = "Sailing POV with sun in upper-left, sail mid-right, partially-occluded horizon"
kind                = "working"
frame_count         = 2
frame_width         = 640
frame_height        = 360
source_rotation_deg = 0
frames              = ["frame.png", "frame_5s_later.png"]

# Reference observer for replay; the actual observer position when
# this video was shot is unknown. Pipeline behavior under these
# inputs is what we're regressing on, not the celestial-mechanics
# correctness of the resulting fix.
[reference_observer]
lat_deg      = 25.0
lon_deg      = -80.0
eye_height_m = 2.0
capture_utc  = "2024-03-15T15:00:00Z"
body         = "sun"

# Day/night classifier expectation. The image-only classifier is
# run on frame 0; the astronomical-prior path lives in the engine
# (which has access to bris-almanac) and is not exercised here.
[expected_classifier]
condition      = "day"
min_confidence = 0.7

# Body centroid as detected by centroid_brightest_body on frame 0.
# Coordinates are in pixels of the (un-rotated) 640x360 image. The
# centroid currently picks the saturated sun correctly; if a
# regression breaks this we want to know.
[expected_centroid_frame0]
x_px         = 98.8
y_px         = 47.7
tolerance_px = 5.0

# Per-method horizon expectations. Each table independently
# describes what the corresponding detector should produce. The
# `correctness` field is documentation; it does not gate the
# assertion. The `outcome` field selects whether the test asserts
# Ok-and-matches (with optional slope/intercept/inlier checks) or
# asserts Err (with optional error_variant substring match).

[horizon.gradient]
outcome             = "ok"
slope               = -0.166
intercept           = 309.9
slope_tolerance     = 0.05
intercept_tolerance = 15.0
correctness         = "wrong"
notes               = "Picks deck-to-sea boundary on the left rather than the sea-sky horizon. Documented failure mode for the gradient detector on cluttered shipboard scenes."

[horizon.sky_region]
outcome             = "ok"
slope               = 0.753
intercept           = 41.0
slope_tolerance     = 0.05
intercept_tolerance = 15.0
correctness         = "wrong"
notes               = "Picks top of mainsail. Documented failure mode for the sky-region detector on cluttered shipboard scenes."

[horizon.segmentation]
outcome             = "ok"
slope               = -0.187
intercept           = 322.3
slope_tolerance     = 0.05
intercept_tolerance = 15.0
inlier_count_min    = 100
correctness         = "approximately_correct"
notes               = "172 of 512 columns produce sky→sea transitions; visually matches the sea-sky boundary on the right side of the frame."
