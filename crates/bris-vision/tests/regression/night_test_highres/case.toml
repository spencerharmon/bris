# Regression metadata for night_test_highres.
#
# Stars over a ship's wake on a dark sky. The user flagged this as
# a "night case we can't yet handle. Star peak detection should
# produce points; plate solving doesn't exist yet so star
# identification will fail. Horizon detection will fail because
# there's no daylight contrast."
#
# Empirical: surprisingly, the sky-region and segmentation horizon
# detectors *both* find a horizon (slope ≈ 0, intercept ≈ 71-87),
# corresponding to the dark-water / dark-but-slightly-lighter-sky
# boundary. The classifier currently says Twilight (mean luma
# 0.155) — with an astronomical prior this would correctly
# resolve to Night. The unmasked centroid lands at (253, 215) on a
# 1156-pixel bright component — probably the brightest visible star
# (or a small group of stars).
#
# Once plate solving lands, this case can flip from "ok-but-no-fix"
# to a "working" night case. For now we record the current
# pipeline behavior.

[case]
name         = "night_test_highres"
description  = "Stars over ship's wake; dark sky; faint horizon visible"
kind         = "working"
frame_count  = 1
frame_width  = 640
frame_height = 360

# Image-only classifier reads this as Twilight (luma is in the
# [0.05, 0.30) band). Once the classifier consults an astronomical
# prior (Sun altitude well below -12°) this will resolve to Night.
[expected_classifier]
condition = "twilight"
notes     = "Image-only path. With astronomical prior this would resolve to Night."

[expected_centroid_frame0]
x_px         = 253.14
y_px         = 215.40
tolerance_px = 5.0

[horizon.gradient]
outcome       = "err"
error_variant = "only 33 inliers"
correctness   = "wrong"

# Surprisingly, the sky-region detector finds a horizon at this
# luma level — mean-brightness threshold catches the slight
# sky-vs-sea brightness difference.
[horizon.sky_region]
outcome             = "ok"
slope               = 0.002
intercept           = 71.05
slope_tolerance     = 0.05
intercept_tolerance = 15.0
inlier_count_min    = 60
correctness         = "approximately_correct"
notes               = "Picks up the slight luma difference between dark sea and dark-but-slightly-brighter sky. Useful unexpected outcome."

[horizon.segmentation]
outcome             = "ok"
slope               = -0.021
intercept           = 86.54
slope_tolerance     = 0.05
intercept_tolerance = 15.0
inlier_count_min    = 400
correctness         = "approximately_correct"
notes               = "Segmentation finds 462 of 512 columns producing transitions on this dark-sky scene; the model generalizes better than expected here."

# Single-pass night detector (mean-gradient): finds the wake
# region at y≈180, not the actual sea horizon at y≈85. Recorded
# as ok-but-wrong: returns Ok, but the value is the wake's
# brightness transition, not the horizon.
[horizon.night]
outcome             = "ok"
slope               = 0.0065
intercept           = 180.44
slope_tolerance     = 0.05
intercept_tolerance = 15.0
inlier_count_min    = 50
correctness         = "wrong"
notes               = "Single-pass mean-gradient lands on the wake, not the sea horizon. Multi-pass (below) finds the actual horizon as a stronger second-pass candidate."

# Multi-pass night detector: surfaces the actual horizon at
# y≈77 (195 inliers) as the top candidate, beating the wake
# region (66 inliers) by inlier count. **This is the working
# path on this scene.**
[horizon.night_multi_pass]
candidates_min          = 2
top_intercept           = 77.0
top_intercept_tolerance = 15.0
top_inlier_count_min    = 150
correctness             = "approximately_correct"
notes                   = "Multi-pass finds the wake region (66 inliers) on its first pass, then masks it and finds the actual sea-sky horizon at y≈77 (195 inliers) on a subsequent pass. Sort by inlier count surfaces the horizon as the top candidate."

# Plate solving: with placeholder camera intrinsics
# (fx = fy = 1000) the pixel→ray angular mapping is wrong by
# the calibration factor (~2-3× off for a real wide-angle
# camera). Even the *correct* sky region won't fit within the
# refinement-residual gate because all pairwise angular
# distances are scaled. The solver correctly refuses rather
# than fabricating a match.
#
# Once a calibration workflow lands and real intrinsics
# replace the placeholder, this expectation will flip from
# "err" to "ok" with a min_identified_stars assertion. The
# canonical plate-solving target — "many bright stars visible
# against truly dark sky" — exists in `container_ship_night`
# (see that case.toml). This case is the secondary plate-
# solving target.
[plate_solve]
outcome              = "err"
error_variant        = "no candidate match"
correctness          = "wrong"
notes                = "Refusal is correct under placeholder intrinsics; will flip to ok once calibration arrives."
config_mag_cutoff    = 5.0
config_max_rms_residual_arcsec = 60.0
