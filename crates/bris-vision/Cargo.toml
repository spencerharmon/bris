[package]
name = "bris-vision"
description = "Image processing, lens calibration, horizon detection, body centroiding, and stitching."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bris-core.workspace = true
bris-math.workspace = true
chrono.workspace = true
image.workspace = true
thiserror.workspace = true
tracing.workspace = true
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[features]
# Segmentation is *not* on by default at the crate level so
# that consumers targeting platforms without an `ort` prebuilt
# (notably `*-linux-android`) get a buildable subset by
# default. Workspace consumers that need the segmentation
# horizon detector (the CLI, the streaming engine, etc.)
# enable it explicitly via `features = ["segmentation"]` on
# the dependency line.
default = []
segmentation = ["dep:ort", "dep:ndarray"]
# ML-based gravity estimator (Layer 2 / heteroscedastic).
# Pulls the same ORT runtime as `segmentation`.
ml-gravity = ["dep:ort", "dep:ndarray"]

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
tempfile.workspace = true
serde.workspace = true
toml.workspace = true

[build-dependencies]
serde.workspace = true
toml.workspace = true
