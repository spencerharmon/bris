name: android

on:
  push:
    branches: [main]
    paths:
      # Only run when something that affects the Android build
      # has changed. The workspace-wide CI in ci.yml covers
      # Rust changes that don't touch the FFI surface.
      - "bris-android/**"
      - "crates/bris-ffi/**"
      - "crates/bris-vision/**"
      - "crates/bris-streaming/**"
      - "crates/bris-almanac/**"
      - "crates/bris-platesolve/**"
      - "crates/bris-nav/**"
      - "crates/bris-nmea/**"
      - "crates/bris-core/**"
      - "crates/bris-calibrate/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "bris-android/**"
      - "crates/bris-ffi/**"
      - "crates/bris-vision/**"
      - "crates/bris-streaming/**"
      - "crates/bris-almanac/**"
      - "crates/bris-platesolve/**"
      - "crates/bris-nav/**"
      - "crates/bris-nmea/**"
      - "crates/bris-core/**"
      - "crates/bris-calibrate/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# `release-nightly` needs to write to the repo's releases.
# The `apk` job does not need write access; the explicit
# `permissions` block at the workflow level is the union, and
# is the minimum needed for the publish step.
permissions:
  contents: write

jobs:
  apk:
    name: build app-debug.apk (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The setup-android action installs cmdline-tools, accepts
      # licenses, and exposes `sdkmanager` on PATH. We then ask
      # it to install the platform and build-tools matching our
      # AGP config, plus an NDK we can cross-compile against.
      - name: set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264

      - name: locate installed NDK
        id: ndk
        run: |
          set -euxo pipefail
          ndk_root=$(ls -d "${ANDROID_HOME}/ndk"/* | sort -V | tail -1)
          ndk_version=$(basename "$ndk_root")
          echo "root=${ndk_root}" >> "$GITHUB_OUTPUT"
          echo "version=${ndk_version}" >> "$GITHUB_OUTPUT"
          echo "Using NDK ${ndk_version} at ${ndk_root}"

      - name: install Rust toolchain + Android targets
        # Channel matches `rust-toolchain.toml` so the targets
        # we install land on the same toolchain rustup will
        # auto-activate inside the Gradle Exec tasks. Using
        # `stable` here installs them on a *different* toolchain
        # (1.94.x but identified differently), and rustup's
        # auto-switch back to the pinned channel inside Gradle
        # would find no Android target std and fail with
        # `error[E0463]: can't find crate for 'core'`.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-linux-android,x86_64-linux-android

      - name: install cargo-ndk
        run: |
          set -euxo pipefail
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --locked
          fi

      - name: cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
          workspaces: ". -> target"

      - name: cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('bris-android/**/*.gradle*', 'bris-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Pin AGP-side ndkVersion to whatever setup-android put
      # under $ANDROID_HOME/ndk/. Avoids CXX1104 / CXX5106
      # warnings firing on every build.
      - name: align ndkVersion with installed NDK
        run: |
          set -euxo pipefail
          file=bris-android/app/build.gradle.kts
          sed -i -E 's|(ndkVersion = ")[^"]+(")|\1${{ steps.ndk.outputs.version }}\2|' "$file"
          grep -n "ndkVersion" "$file"

      - name: write local.properties
        run: |
          cat > bris-android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF
          cat bris-android/local.properties

      - name: assemble debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.root }}
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: |
          set -euxo pipefail
          cd bris-android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: list build outputs
        run: |
          set -euxo pipefail
          find bris-android/app/build/outputs/apk -type f -name '*.apk' -printf '%p  %s bytes\n'

      - name: upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bris-app-debug-${{ github.sha }}
          path: bris-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-nightly:
    name: publish rolling nightly pre-release
    # Only on push-to-main. PRs and workflow_dispatch don't
    # publish releases.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: bris-app-debug-${{ github.sha }}
          path: artifact

      - name: rename apk with short sha
        id: rename
        run: |
          set -euxo pipefail
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p release
          cp "artifact/app-debug.apk" "release/bris-app-debug-${short}.apk"
          ls -la release
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          # Also stage a stable filename so a long-lived "always
          # grab the latest" URL works without knowing the SHA.
          cp "artifact/app-debug.apk" "release/bris-app-debug-latest.apk"

      - name: compose release body
        id: body
        run: |
          set -euxo pipefail
          subject=$(git log -1 --pretty=%s "${{ github.sha }}")
          now_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          {
            echo "Rolling pre-release built from \`main\`."
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Subject: ${subject}"
            echo "- Built: ${now_utc}"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "adb install bris-app-debug-${{ steps.rename.outputs.short }}.apk"
            echo '```'
            echo
            echo "Debug-keystore signed; \`Allow from unknown sources\` is required"
            echo "for non-adb installs."
            echo
            echo "## Permanent stable URL"
            echo
            echo "The latest nightly is always at:"
            echo
            echo "    https://github.com/spencerharmon/bris/releases/download/nightly/bris-app-debug-latest.apk"
            echo
            echo "Per-build URL (this build):"
            echo
            echo "    https://github.com/spencerharmon/bris/releases/download/nightly/bris-app-debug-${{ steps.rename.outputs.short }}.apk"
          } > release-body.md
          cat release-body.md

      - name: purge previous assets from nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # softprops/action-gh-release@v2 *appends* assets to
          # an existing release rather than replacing them.
          # Without this purge step the rolling \`nightly\`
          # release accumulates one SHA-named APK per push and
          # never garbage-collects. Delete every existing asset
          # before the publish step uploads the current build.
          if gh release view nightly \
                -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view nightly \
                -R "${{ github.repository }}" \
                --json assets --jq '.assets[].name' \
              | while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  gh release delete-asset nightly "$name" \
                    -R "${{ github.repository }}" --yes
                done
          fi

      - name: publish or update nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          # Rolling tag: same tag updated on every push to
          # main. The preceding purge step ensures we end up
          # with exactly the two assets we just uploaded
          # (bris-app-debug-<sha>.apk and
          # bris-app-debug-latest.apk).
          tag_name: nightly
          name: nightly
          prerelease: true
          files: |
            release/bris-app-debug-${{ steps.rename.outputs.short }}.apk
            release/bris-app-debug-latest.apk
          body_path: release-body.md
          make_latest: false
