name: android

on:
  push:
    branches: [main]
    paths:
      # Only run when something that affects the Android build
      # has changed. The workspace-wide CI in ci.yml covers
      # Rust changes that don't touch the FFI surface.
      - "bris-android/**"
      - "crates/bris-ffi/**"
      - "crates/bris-vision/**"
      - "crates/bris-streaming/**"
      - "crates/bris-almanac/**"
      - "crates/bris-platesolve/**"
      - "crates/bris-nav/**"
      - "crates/bris-nmea/**"
      - "crates/bris-core/**"
      - "crates/bris-calibrate/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "bris-android/**"
      - "crates/bris-ffi/**"
      - "crates/bris-vision/**"
      - "crates/bris-streaming/**"
      - "crates/bris-almanac/**"
      - "crates/bris-platesolve/**"
      - "crates/bris-nav/**"
      - "crates/bris-nmea/**"
      - "crates/bris-core/**"
      - "crates/bris-calibrate/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: build app-debug.apk (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The setup-android action installs cmdline-tools, accepts
      # licenses, and exposes `sdkmanager` on PATH. We then ask
      # it to install the platform and build-tools matching our
      # AGP config, plus an NDK we can cross-compile against.
      - name: set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264

      - name: locate installed NDK
        id: ndk
        run: |
          set -euxo pipefail
          ndk_root=$(ls -d "${ANDROID_HOME}/ndk"/* | sort -V | tail -1)
          ndk_version=$(basename "$ndk_root")
          echo "root=${ndk_root}" >> "$GITHUB_OUTPUT"
          echo "version=${ndk_version}" >> "$GITHUB_OUTPUT"
          echo "Using NDK ${ndk_version} at ${ndk_root}"

      - name: install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: install cargo-ndk
        run: |
          set -euxo pipefail
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --locked
          fi

      - name: cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
          workspaces: ". -> target"

      - name: cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('bris-android/**/*.gradle*', 'bris-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Pin AGP-side ndkVersion to whatever setup-android put
      # under $ANDROID_HOME/ndk/. Avoids CXX1104 / CXX5106
      # warnings firing on every build.
      - name: align ndkVersion with installed NDK
        run: |
          set -euxo pipefail
          file=bris-android/app/build.gradle.kts
          sed -i -E 's|(ndkVersion = ")[^"]+(")|\1${{ steps.ndk.outputs.version }}\2|' "$file"
          grep -n "ndkVersion" "$file"

      - name: write local.properties
        run: |
          cat > bris-android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF
          cat bris-android/local.properties

      - name: assemble debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.root }}
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: |
          set -euxo pipefail
          cd bris-android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: list build outputs
        run: |
          set -euxo pipefail
          find bris-android/app/build/outputs/apk -type f -name '*.apk' -printf '%p  %s bytes\n'

      - name: upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bris-app-debug-${{ github.sha }}
          path: bris-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
