# Publish bris-collector to ghcr.io/<lowercase GitHub owner>, pinned BY DIGEST.
# Uses the automatic GITHUB_TOKEN; no deployment registry configuration needed.
# The source label links the package to this repo. Package visibility must be
# public separately: the anonymous pull check below fails if it is private.
#
# The published image is pushed by tag AND resolved to its digest,
# emitted as the job output `digest` and printed to the step summary
# so the flux side can pin `registry/namespace/bris-collector@<digest>`.
#
# Definition of done (downstream check):
#   skopeo inspect --no-creds docker://$BRIS_COLLECTOR_IMAGE
# where $BRIS_COLLECTOR_IMAGE is the digest reference above — proving
# the image really published and is pullable by digest.

name: collector-image

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "scripts/test_container_images.py"
      - ".github/workflows/collector-image.yml"
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repository=ghcr.io/${OWNER,,}/bris-collector" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/bris-collector/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=collector-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=collector-${{ matrix.arch }}

      - name: Run native container regressions
        env:
          TAG: ${{ steps.image.outputs.repository }}:${{ github.sha }}-${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/test_container_images.py --image collector --platform "$PLATFORM" --tag "$TAG" --skip-build

      - name: Push tested native image
        env:
          TAG: ${{ steps.image.outputs.repository }}:${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$TAG"

  build-and-push:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Set image repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repository=ghcr.io/${OWNER,,}/bris-collector" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarch manifest
        id: build
        env:
          REPO: ${{ steps.image.outputs.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tags=(--tag "${REPO}:${SHA}")
          if [[ "$REF" == refs/heads/main ]]; then tags+=(--tag "${REPO}:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "${REPO}:${SHA}-amd64" "${REPO}:${SHA}-arm64"
          DIGEST=$(docker buildx imagetools inspect "${REPO}:${SHA}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve and record the published digest
        id: push
        env:
          REPO: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "imagetools did not emit a digest" >&2
            exit 1
          fi
          IMAGE="${REPO}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "## bris-collector image published"
            echo ""
            echo "Pinned by digest (set \`BRIS_COLLECTOR_IMAGE\` to this on the flux side):"
            echo ""
            echo '```'
            echo "${IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the pushed image is pullable by digest
        env:
          BRIS_COLLECTOR_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          # The definition-of-done check, run in-workflow against the
          # freshly-pushed image. skopeo is preinstalled on the runner
          # image; install it if absent.
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo inspect --no-creds \
            "docker://${BRIS_COLLECTOR_IMAGE}"
