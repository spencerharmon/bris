name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-features` would turn on the segmentation feature
      # in workspace consumers that don't currently opt in (the
      # FFI is intentionally segmentation-off for Android-target
      # compatibility); the explicit list mirrors what each
      # crate's Cargo.toml already enables.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_args: --workspace
          # macOS targets (aarch64-apple-darwin, x86_64-apple-darwin)
          # are spec'd in plan.org L165 but deferred: bris-capture
          # depends transitively (via the workspace dep graph) on
          # v4l2-sys-mit, which requires <linux/videodev2.h> and
          # cannot build on Darwin even with --exclude bris-capture
          # because cargo still resolves the dep tree for the
          # workspace virtual manifest. Unblocking requires either
          # (a) splitting bris-capture into a separate workspace, or
          # (b) feature-gating v4l2-sys-mit behind a `linux-capture`
          # cargo feature so non-Linux platforms skip the build
          # script. Operator decision needed; tracked in plan.org
          # L165 audit annotation.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.cargo_args }}

  cross-build:
    name: cross-build aarch64-linux-gnu (Pi Zero 2W class)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: configure cross-compile linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'

          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      # Cross-build the full workspace. bris-cli and bris-capture
      # (segmentation feature -> ort, plus bris-cli's blake3 C
      # build) were previously excluded; both now build cleanly
      # against the aarch64-linux-gnu cross toolchain installed
      # above. ort fetches an aarch64 prebuilt at build time.
      # bris-capture's V4L2 backend is Linux-only and so is
      # valid here.
      - run: |
          cargo build --release --target aarch64-unknown-linux-gnu \
            -p bris-core \
            -p bris-almanac \
            -p bris-vision \
            -p bris-platesolve \
            -p bris-nav \
            -p bris-nmea \
            -p bris-streaming \
            -p bris-capture \
            -p bris-calibrate \
            -p bris-cli \
            -p bris-ffi \
            -p bris-collector

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Match rust-toolchain.toml so the action's container
          # has the right toolchain installed before cargo-deny
          # runs (otherwise rustup tries to install
          # `1.94-x86_64-unknown-linux-musl` and fails).
          rust-version: "1.94"
