# cargo-deny configuration. Run with `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive unmaintained advisories. Tracked; both crates are
# pulled by upstream deps we don't control directly. Replacing
# them is a Phase 6 cleanup task.
ignore = [
    # bincode: unmaintained. Pulled by `vision-calibration`'s
    # serialization path.
    "RUSTSEC-2025-0141",
    # paste: no longer maintained. Pulled transitively (likely
    # by `ort` or one of the gemm/faer dependencies).
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# GPL-3.0-or-later is the project license. Permissive licenses are
# compatible (we relicense outbound under GPL-3). Strong copyleft other
# than GPL-3 family is forbidden because it would conflict.
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # NCSA appears in some llvm-derived crates we pull
    # transitively; permissive, GPL-compatible.
    "NCSA",
    # Linux Foundation Community Data License Agreement —
    # appears on shipped data tables in some upstream deps;
    # permissive, GPL-compatible.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Workspace path dependencies (`bris-* = { workspace = true }`)
# render as wildcards to cargo-deny because they don't carry a
# version constraint. They aren't published to crates.io —
# they're internal — so the wildcard is fine. The
# `allow-wildcards` list still rejects wildcards from external
# crates we don't control.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
