# nginx config for the corpus-explorer static server.
#
# Serves a merged web root:
#   $CORPUS_WEB_ROOT (default /srv/corpus)  — the PVC-mounted
#     corpus data-root: index.json, sessions/<uuid>/…, -render.png
#   /tools/corpus-explorer/  — the SPA assets baked into the image
#     at /opt/corpus-explorer/ (kept out of the web root so a PVC
#     mount cannot shadow them).
#
# No infra identifiers here: host/TLS/DNS are terminated by traefik
# on the flux side. This server listens plain HTTP on 8080.

worker_processes  auto;
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Serve JSON reports with the right type; .json is already in
    # mime.types, but pgm/render assets need sane defaults.
    types {
        image/png  png;
    }

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Writable temp paths for the unprivileged nginx user.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log off;

    server {
        listen 8080;
        server_name _;

        # Corpus data-root (PVC mount). autoindex is intentionally
        # off — the SPA fetches known paths (index.json, per-session
        # report_path/render_path) and never lists directories.
        root /srv/corpus;

        # Liveness/readiness probe: no data-root dependency.
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Bare root → the explorer entrypoint.
        location = / {
            return 302 /tools/corpus-explorer/index.html;
        }

        # Baked SPA assets, served from OUTSIDE the web root so the
        # PVC can never shadow them.
        location /tools/corpus-explorer/ {
            alias /opt/corpus-explorer/;
            try_files $uri $uri/ =404;
        }

        # Everything else falls through to the corpus data-root
        # ($root). A missing report/overlay yields a clean 404 that
        # the SPA surfaces, never a directory listing.
        location / {
            try_files $uri =404;
        }
    }
}
